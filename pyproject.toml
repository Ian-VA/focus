[project]
name = "focus-now"
version = "0.2.1"
description = "An AI agent that watches your screen and keeps you on task"
readme = "README.md"
authors = [
    { name = "Ian Atroshchenko", email = "ianatroshchenko@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "brotli>=1.2.0",
    "mss>=10.2.0",
    "openai>=3.23.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyfiglet>=1.0.4",
    "pyobjc-framework-ApplicationServices>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0 ; sys_platform == 'darwin'",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "typer>=0.27.2",
]

[project.scripts]
focus = "focus.main:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "focus",
]

[tool.uv.build-backend]
module-name = "focus"
